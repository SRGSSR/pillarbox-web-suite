name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        env:
          CI: true
        run: |
          npm pkg delete scripts.prepare
          npm ci

      - name: Run JS and CSS linters
        run: |
          npm run eslint && npm run stylelint

      - name: Run Build
        run: |
          npm run build -ws

      - name: Run unit tests
        run: |
          npm test

      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2

      - name: Filter changes in scripts folder
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        with:
          filters: |
            scripts:
              - 'scripts/**'

      - name: Run create tests if scripts folder changed
        if: steps.filter.outputs.scripts == 'true'
        run: |
          echo "Changes detected in scripts folder."
          npm run test:create
